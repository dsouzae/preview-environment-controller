# GitHub Actions: the fast, cluster-free checks every push and pull request to
# main must pass. It mirrors what a contributor runs locally (make build test vet
# plus gofmt). Go's download cache is disabled because builds use the committed
# vendor tree, so there is nothing to cache.
name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Majors that run on the Node 24 runtime; older ones warn about Node 20.
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - run: make build test vet
      - name: Check Go formatting
        run: test -z "$(gofmt -l api cmd internal)"
# Image publication and GitOps tag updates arrive in the delivery milestone.
# envtest (make test-integration) and lint (make lint) require pinned tools
# provisioned on the runner first; until then run them locally (docs/testing.md).
