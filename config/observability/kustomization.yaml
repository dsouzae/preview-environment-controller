apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Optional edlab deployment: replaces HTTPS metrics with cluster-internal HTTP.
resources:
- ../default
patches:
- path: manager.yaml
  target:
    kind: Deployment
- target:
    kind: Service
    name: preview-environment-controller-manager-metrics
  patch: |-
    - op: replace
      path: /spec/ports
      value:
      - name: http-metrics
        port: 9090
        targetPort: 9090
        protocol: TCP
    - op: add
      path: /metadata/annotations
      value:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
        prometheus.io/scheme: http
