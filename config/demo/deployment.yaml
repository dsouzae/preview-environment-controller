# Demo workload for the Argo CD smoke test; the application sample in
# config/samples points at this directory. It shows what a preview-compatible
# manifest needs:
# - no metadata.namespace: Argo CD places it in the preview's destination, and the
#   AppProject denies manifests that name their own namespace;
# - serviceAccountName: preview-workload, the baseline identity with no API token;
# - requests and limits inside the LimitRange (max 1 CPU / 1Gi per container) and
#   the ResourceQuota (10 pods, 2 CPU / 2Gi of requests);
# - a read-only root filesystem, so the paths nginx writes to are emptyDir mounts.
# The image tag is for the learning exercise; pin a digest for repeatable use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-demo
  template:
    metadata:
      labels:
        app: preview-demo
    spec:
      serviceAccountName: preview-workload
      # The baseline does not enforce Pod Security Standards; keep workloads
      # restricted-compatible anyway. 101 is the nginx user in the unprivileged image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        # Listens on 8080 so it can run without root; the Service maps 80 to it.
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - name: http
          containerPort: 8080
        # Explicit values; the LimitRange would default them if omitted.
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        readinessProbe:
          httpGet: {path: /, port: http}
        livenessProbe:
          httpGet: {path: /, port: http}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
