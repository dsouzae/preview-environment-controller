# ClusterIP Service for the demo. The ResourceQuota allows zero NodePort and
# LoadBalancer Services, and the baseline NetworkPolicy admits traffic only from
# pods in the same preview namespace, so the smoke test reaches it from an
# in-namespace probe pod (wget http://preview-demo).
apiVersion: v1
kind: Service
metadata:
  name: preview-demo
spec:
  selector:
    app: preview-demo
  ports:
  - name: http
    port: 80
    targetPort: http
