---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: previewenvironments.platform.ellery.dev
spec:
  group: platform.ellery.dev
  names:
    kind: PreviewEnvironment
    listKind: PreviewEnvironmentList
    plural: previewenvironments
    singular: previewenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PreviewEnvironment represents an ephemeral application environment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PreviewEnvironmentSpec defines the namespace and optional
              Git application.
            properties:
              namespace:
                description: |-
                  Namespace is immutable. If omitted, a name is derived from the CR UID.
                  Explicit names must stay within the reserved preview- prefix.
                maxLength: 63
                pattern: ^preview-[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: namespace is immutable
                  rule: self == oldSelf
              path:
                description: Path is the manifest directory within the repository;
                  defaults to its root.
                maxLength: 1024
                minLength: 1
                type: string
              repository:
                description: Repository is an Argo CD Git repository URL. Omit for
                  a baseline-only preview.
                maxLength: 2048
                minLength: 1
                type: string
              revision:
                description: Revision is a Git branch, tag or commit. A commit gives
                  reproducible deployment.
                maxLength: 256
                minLength: 1
                type: string
              ttl:
                description: |-
                  TTL expires the preview relative to metadata.creationTimestamp, not readiness.
                  Omit for no expiry. Positive whole hours/minutes/seconds, for example 24h or 1h30m.
                maxLength: 32
                minLength: 1
                pattern: ^([0-9]+h)?([0-9]+m)?([0-9]+s)?$
                type: string
                x-kubernetes-validations:
                - message: ttl must be a positive duration
                  rule: duration(self) > duration('0s')
            type: object
            x-kubernetes-validations:
            - message: revision is required with repository
              rule: '!has(self.repository) || has(self.revision)'
            - message: revision and path require repository
              rule: has(self.repository) || (!has(self.revision) && !has(self.path))
            - message: repository cannot be removed once configured
              rule: '!has(oldSelf.repository) || has(self.repository)'
            - message: namespace cannot be added or removed
              rule: has(self.namespace) == has(oldSelf.namespace)
          status:
            description: PreviewEnvironmentStatus describes the last reconciliation
              result.
            properties:
              application:
                description: Application is the managed Application name in the configured
                  Argo CD namespace.
                type: string
              applicationHealth:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: ExpiresAt is creationTimestamp plus TTL; absent when
                  expiry is disabled or invalid.
                format: date-time
                type: string
              namespace:
                description: Namespace is the computed target namespace.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Ready includes application sync and health when a repository
                  is configured.
                type: string
              syncStatus:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
